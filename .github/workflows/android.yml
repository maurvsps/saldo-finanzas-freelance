name: APK de Android

# Compila la app de Android (android-app/) y la deja como descarga en Releases.
# La app abre la web publicada en GitHub Pages, así que los cambios de la web
# no necesitan un APK nuevo; solo hace falta recompilar si cambia android-app/.
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Proyecto Android e íconos
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Compilar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Firma con tu clave propia: permite instalar actualizaciones sin desinstalar.
            ./gradlew assembleRelease --no-daemon
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/saldo.keystore"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/saldo.keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "${KEY_ALIAS:-saldo}" --out "$GITHUB_WORKSPACE/saldo.apk" "$RUNNER_TEMP/aligned.apk"
          else
            # Sin clave propia: firma de depuración, suficiente para instalarla tú.
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/saldo.apk"
          fi

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: saldo-apk
          path: saldo.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Saldo para Android (${{ github.run_number }})
          body: |
            Descarga `saldo.apk` desde el teléfono y ábrelo para instalar.
            Android te pedirá permitir la instalación desde esta fuente.
          files: saldo.apk
          make_latest: true
